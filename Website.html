<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.5/babel.min.js"></script>
    <style>
        .mynav{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(195, 208, 221);
            margin: 20px;
        }
        .mynav ul{
            display: flex;
            padding:0px;
            margin-left: 900px;
           
        }
        .mynav ul li{
            list-style: none;
            width:100px;       
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function Header(){
            return (
                <div className="mynav">
                    <h1>Edupoly</h1>
                    <ul>
                     <li>Home</li> 
                     <li>ContactUs</li> 
                     <li>AboutUs</li> 
                    </ul>
                </div>
            )
        }
      ReactDOM.render( <div><Header></Header><Header></Header><Header></Header></div>,document.getElementById("root")) 
   
    </script>
</body>
</html>
