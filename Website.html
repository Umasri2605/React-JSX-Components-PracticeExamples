<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.5/babel.min.js"></script>
    <style>
        .mynav{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(195, 208, 221);
            margin: 20px;
        }
        .mynav ul{
            display: flex;
            padding:0px;
            margin-left: 900px;
        }
        .mynav ul li{
            list-style: none;
            width:100px;       
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function Header(){
            return (
                <div className="mynav">
                    <h1>Edupoly</h1>
                    <ul>
                     <li>Home</li> 
                     <li>ContactUs</li> 
                     <li>AboutUs</li> 
                    </ul>
                </div>
            )
        }
        function MainArea(){
            return (
                <div style={{display:"flex"}}>
                    <div style={{fontSize:"1.5em",display:"flex",flexDirection:"column",width:"100%",alignItems:"center",justifyContent:"center"}} >
                        <h2>Code Your Career</h2>
                        <h2>Prepare Practice Perform</h2>
                    </div>
                    <div style={{width:"100%"}} >
                        <img style={{width:"100%"}} src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRv280kuEeZ3GxvPe0dq7fGb7IHy-HYuTmLsQ&s" alt="" />
                    </div>
                </div>
            )
        }
        function Footer(){
            return (
                <div>
                    <p style={{fontSize:"1em"}}>The software solutions market is experiencing strong growth, with worldwide IT spending expected to reach $5 trillion in 2024 and the custom software development market projected to grow at a 22.5% CAGR from 2024-2030. Demand for developers is high, with over 47.2 million developers globally in 2025 and a projected shortage of 4 million by the same year. Businesses are investing in software to improve efficiency and revenue, with some reporting 20% growth on average. </p>
                </div>
            )
        }
      ReactDOM.render( <div><Header></Header><MainArea></MainArea><Footer></Footer></div>,document.getElementById("root")) 
   
    </script>
</body>
</html>
